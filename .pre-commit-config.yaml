# Install once per clone: pre-commit install
# Keep the ruff rev in sync with ruff== in requirements-dev.txt.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
  - repo: local
    hooks:
      - id: gitleaks-system
        name: gitleaks (system binary)
        entry: gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false
